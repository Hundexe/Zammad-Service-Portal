<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Service-Portal für Zammad – Video-Einführung</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(80% 60% at 20% 0%, #1c2f6b 0%, transparent 60%), radial-gradient(70% 60% at 100% 100%, #0d4d4a 0%, transparent 60%), #060a14; color: #f4f7ff; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: min(1200px, calc(100% - 32px)); padding: 32px 0; }
  .eyebrow { font: 600 13px/1 ui-monospace, "DejaVu Sans Mono", monospace; letter-spacing: .2em; text-transform: uppercase; color: #2fd4c0; }
  h1 { font-size: clamp(28px, 4vw, 48px); letter-spacing: -0.03em; margin: 12px 0 20px; }
  video { width: 100%; border-radius: 16px; box-shadow: 0 30px 90px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); background: #000; }
  p { color: #9fb0d6; }
  a { color: #7aa2ff; }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Service-Portal für Zammad</div>
  <h1>Video-Einführung (2:32)</h1>
  <video controls playsinline preload="metadata" poster="poster.jpg">
    <source src="service-portal-demo.mp4" type="video/mp4">
    <track kind="captions" src="service-portal-demo.de.vtt" srclang="de" label="Deutsch">
  </video>
  <p>Mit Ton und eingeblendeten Untertiteln. <a href="../">Zur Online-Demo zum Durchklicken</a> · <a href="https://github.com/Hundexe/Zammad-Service-Portal">Projekt auf GitHub</a></p>
</main>
</body>
</html>
